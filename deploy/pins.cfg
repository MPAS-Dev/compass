# pins for the pixi environment
[pixi]
bootstrap_python = 3.14
python = 3.14
esmf = 8.9.1
geometric_features = 1.6.3
mache = 5.2.0
mpas_tools = 2.1.0
otps = 2021.10
parallelio = 2.6.9

# pins for the spack environment
[spack]
albany = compass-2026-03-21
albany_variants = +mpas~py+unit_tests
# cmake newer than 3.27.0 needed for Trilinos
cmake = 3.27.0:
hdf5 = 1.14.6
metis = 5.1.0
moab = 5.6.0
scorpio = 1.8.2
trilinos = compass-2026-02-06
trilinos_variants =

# pins for both pixi and spack environments
[all]
netcdf_c = 4.10.1
netcdf_fortran = 4.6.3
pnetcdf = 1.15.0
