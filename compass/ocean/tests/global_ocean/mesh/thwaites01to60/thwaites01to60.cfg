# config options for thwaites01to60 mesh
[thwaites01to60]

# OPTIONAL: Regional domain (if not set, keeps full global mesh)
# Uncomment ONE of these approaches to enable regional culling:

# Option A: Use geojson polygon
# regional_domain_geojson = amundsen_domain.geojson

# Option B: Use lat-lon bounding box (Amundsen Sea sector)
# Recommended for testing: covers Thwaites, Pine Island, and surrounding area
lat_min = -76.0
lat_max = -73.0
lon_min = -116.0
lon_max = -98.0

# OPTIONAL: Thin film beneath grounded ice
thin_film_present = False
thin_film_thickness = 0.05
haf_threshold = 30.0
film_inland_extent = 30e3

# Resolution parameters for base mesh generation (km)
res_gz = 0.2
res_cavity = 1.0
res_shelf = 3.0
res_far = 8.0
gz_band_halfwidth = 15.0

# the name of the topography file in the bathymetry database
topo_filename = BedMachineAntarctica-v3_GEBCO_2023_ne3000_20250110.nc
src_scrip_filename = ne3000_20250110.scrip.nc

# description of the bathymetry
description = Bathymetry is from GEBCO 2023, combined with BedMachine
              Antarctica v3 (will update to v4), with Thwaites grounding zone refinement

# Use BedMachine v4 when available
[combine_topo]
# antarctic_filename = BedMachineAntarctica-v4.nc
