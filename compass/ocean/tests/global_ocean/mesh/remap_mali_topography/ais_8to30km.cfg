# config options related to remapping topography to an MPAS-Ocean mesh
[remap_topography]

# the density of land ice from MALI (kg/m^3)
ice_density = 910.0

# the density of ocean water (kg/m^3), equivalent to config_ocean_density in MALI
ocean_density = 1028.0

# the elevation of sea level, equivalent to config_sea_level in MALI
sea_level = 0.0


# config options related to remapping MALI topography to an MPAS-Ocean mesh
[remap_mali_topography]

# The MALI topography file: E3SM's default MALI initial condition for the
# ais8to30 grid.  The default path is on Chrysalis.
mali_filename = /lcrc/group/e3sm/data/inputdata/glc/mpasli/mpas.ais8to30km/ais_8to30km.20250625.nc

# A precomputed mapping file from the MALI mesh to the MPAS-Ocean mesh (e.g.
# E3SM's glc-to-ocn coupler map). If empty, the map is computed with mbtempest
map_filename =

# Whether to normalize the land-ice fractions by the MALI ocean fraction, so
# landIceFracObserved and landIceFloatingFracObserved are both the floating
# fraction of the area that is below sea level and not grounded, as E3SM's
# coupler delivers them to the ocean with GLC2OCN_SHELF_MASK=ungrounded
normalize_land_ice_fractions = False
