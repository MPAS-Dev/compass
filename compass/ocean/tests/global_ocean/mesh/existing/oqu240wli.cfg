# config options related to reusing an existing, culled MPAS-Ocean mesh
[existing_mesh]

# A file containing the existing horizontal mesh (typically the initial
# condition used in E3SM).  If it contains landIceFraction or landIceMask,
# these are used to identify which land ice is connected to the Antarctic
# Ice Sheet.  The default path is on Chrysalis.
mesh_filename = /lcrc/group/e3sm/data/inputdata/ocn/mpas-o/oQU240wLI/ocean.QU.240wLI.230220.nc


# config options related to remapping MALI topography to an MPAS-Ocean mesh
[remap_mali_topography]

# E3SM's glc-to-ocn coupler map, so the land-ice pressure and fractions match
# what the coupler delivers.  The default path is on Chrysalis.
map_filename = /lcrc/group/e3sm/data/inputdata/cpl/gridmaps/mpas.ais8to30km/map_ais8to30_to_oQU240wLI-nomask_esmfaave.20240701.nc

# Normalize land-ice fractions as E3SM's coupler does with
# GLC2OCN_SHELF_MASK=ungrounded
normalize_land_ice_fractions = True


# Options related to the vertical grid
[vertical_grid]

# the same 60 vertical levels as the existing oQU240wLI initial condition
grid_type = 60layerPHC

# the bottom of the 60layerPHC grid, so the grid is not rescaled
bottom_depth = 5499.989044189453


# options for global ocean testcases
[global_ocean]

# The oQU240wLI mesh was created for E3SM version 1.  Using this version
# avoids a name clash with the QUwISC240 mesh that compass creates.
e3sm_version = 1
mesh_revision = 1
