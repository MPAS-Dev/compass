# options for spherical meshes
[spherical_mesh]

## config options related to the step for culling land from the mesh
convert_culled_mesh_to_cdf5 = True
# number of cores to use
cull_mesh_cpus_per_task = 18
# minimum of cores, below which the step fails
cull_mesh_min_cpus_per_task = 1
# maximum memory usage allowed (in MB)
cull_mesh_max_memory = 1000

# Elevation threshold to use for including land cells
floodplain_elevation = 20.0
# Resolution threshold to use for including land cells
floodplain_resolution = 16.0
floodplain_geojson = mab_floodplain.geojson
# Minimum depth to enforce outside floodplain region
min_depth_outside_floodplain = 1.0


# options for global ocean testcases
[global_ocean]

# The following options are detected from .gitconfig if not explicitly entered
author = autodetect
email = autodetect


# options for hurricane testcases
[hurricane]

## config options related to the initial_state step
# number of MPI tasks to use
init_ntasks = 512
# minimum of MPI tasks, below which the step fails
init_min_tasks = 1
# maximum memory usage allowed (in MB)
init_max_memory = 1000
# number of threads
init_threads = 1

## config options related to the forward steps
# number of MPI tasks to use
forward_ntasks = 1024
# minimum of MPI tasks, below which the step fails
forward_min_tasks = 1024
# maximum memory usage allowed (in MB)
forward_max_memory = 1000
# number of threads
forward_threads = 1

# config options related to remapping topography to an MPAS-Ocean mesh
[remap_topography]

# the name of the topography file in the bathymetry database
topo_filename = BedMachineAntarctica-v3_GEBCO_2023_ne3000_20250110.nc
src_scrip_filename = ne3000_20250110.scrip.nc

# weight generator function:
#    `tempest` for cubed-sphere bathy or `esmf` for latlon bathy
weight_generator = tempest

# the description to include in metadata
description = Bathymetry is from GEBCO 2023, combined with BedMachine
              Antarctica v3 around Antarctica.

# the target and minimum number of MPI tasks to use in remapping
ntasks = 4096
min_tasks = 2048

# remapping method {'bilinear', 'neareststod', 'conserve'}
# must use 'conserve' for tempestremap
method = conserve

# threshold of what fraction of an MPAS cell must contain ocean in order to
# perform renormalization of elevation variables
renorm_threshold = 0.01

# the density of land ice from MALI (kg/m^3)
ice_density = 910.0

# smoothing parameters
# no smoothing (required for esmf):
#     expandDist = 0   [m]
#     expandFactor = 1 [cell fraction]
expandDist = 0
expandFactor = 1

# The io section describes options related to file i/o
[io]

# the NetCDF file format: NETCDF4, NETCDF4_CLASSIC, NETCDF3_64BIT, or
# NETCDF3_CLASSIC
format = NETCDF4

# the NetCDF output engine: netcdf4 or scipy
# the netcdf4 engine is not performing well on Chrysalis and Anvil, so we will
# try scipy for now.  If we can switch to NETCDF4 format, netcdf4 will be
# required
engine = netcdf4
