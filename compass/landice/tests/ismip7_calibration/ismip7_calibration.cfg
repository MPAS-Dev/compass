# config options for the ISMIP7 melt-module calibration
[ismip7_calibration]

# Base path to the ISMIP7 AIS datasets, the directory containing
# parameterisations/, obs/ and grid/.  User has to supply.
base_path_ismip7 = NotAvailable

# Base path to the MALI mesh and its ancillary files.  User has to supply.
base_path_mali = NotAvailable

# MALI mesh file, holding the present-day geometry to calibrate on.  The
# protocol asks for present-day geometry, and the E3SM inputdata meshes are
# pre-relaxation and already essentially observed, so no geometry replacement
# is needed.  User has to supply.
mali_mesh_file = NotAvailable

# Name of the MALI mesh.  Used to name mapping and output files.
mali_mesh_name = NotAvailable

# MALI region mask file, used to cross-check the remapped ISMIP7 basins
# against the ISMIP6-era regions.  Set to None to skip the cross-check, but
# note that this check is what catches the ISMIP7/MALI basin numbering being
# off by one.
region_mask_file = NotAvailable

# Which ocean states to use.  Options:
#   minimal     - 7 states, those marked X in protocol Table 2
#   recommended - 11 states, adding the regional pairs marked +
#   all         - 28 states, everything ISMIP7 distributes
# The reduced sets leave J4 structurally under-powered: with PIG alone it
# constrains a single amplitude that any form can match by rescaling its
# parameter.
ocean_state_subset = all

# Which melt forms to calibrate, comma separated.  Options:
#   ismip7 - the Burgard et al. (2022) local quadratic, calibrating K
#   ismip6 - the ISMIP6 non-local quadratic, calibrating gamma0.  With a
#            constant salinity this is algebraically identical to the
#            Burgard semi-local form, so it is how the semi-local form is
#            calibrated.
melt_forms = ismip7, ismip6

# Number of MPI tasks for ESMF_RegridWeightGen
esmf_ntasks = 128

# Number of MPI tasks for each MALI run
ntasks = 128

# Length of the single timestep the melt diagnostic takes.  MALI computes
# melt inside the timestep rather than in the initial diagnostic solve, so a
# zero-length run would produce no melt at all.
timestep = 0000-00-01_00:00:00


# config options for remapping the ISMIP7 masks onto the MALI mesh
[ismip7_calibration_masks]

# Remapping method.  Every mask field is categorical, so nearest neighbour is
# the appropriate choice.  Options: bilinear, neareststod, conserve
method_remap = neareststod


# config options for remapping the ISMIP7 thermal forcing onto the MALI mesh
[ismip7_calibration_forcing]

# Remapping method.  Options: bilinear, neareststod, conserve
method_remap = bilinear


# config options for the melt parameterizations
[ismip7_calibration_melt]

# Practical salinity at the ice draft, PSU.  The ISMIP7 ocean forcing
# processed for the MALI projections carries thermal forcing only, so a
# projection has no salinity field to read; calibrating against a spatially
# varying salinity would tune K for physics the projections cannot run.
# Melt is linear in salinity, so this is a coefficient multiplying K.
salinity = 34.5

# The sin(theta) factor of the ISMIP7 quadratic, where theta is the ice-draft
# slope angle.  Held constant, so it too simply multiplies K.  The default is
# the Antarctic-mean value from Bedmap3 on the ISMIP 8 km grid, matching the
# published calibration.
sin_slope = 0.0051117

# Magnitude of the Coriolis parameter, s^-1.  Constant, as in the protocol's
# reference implementation.
coriolis = 1.4e-4

# Reference parameter values the ensemble is run at.  Melt is exactly
# proportional to the melt parameter, so one run per ocean state at a
# reference value is enough and the whole parameter grid follows by scaling.
# The reference values are divided out again, so they do not affect results.
reference_k = 1.0e-4
reference_gamma0 = 10000.0

# The K grid for the ISMIP7 local form: minimum, maximum and step.  The
# defaults are the 120 values the protocol's worked example samples.
k_min = 0.25e-5
k_max = 3.0e-4
k_step = 0.25e-5

# The gamma0 grid for the ISMIP6 non-local form, m yr^-1: minimum, maximum
# and step.  The maximum has to be high enough that no draw of the objective
# lands on it: a distribution that piles up against the end of the grid has
# been clipped, and its upper percentiles are not meaningful.
gamma0_min = 250.0
gamma0_max = 50000.0
gamma0_step = 250.0


# config options for the objective function and the parameter selection
[ismip7_calibration_objective]

# Number of random draws of the term weights and the targets
sample_size = 100000

# Seed for the random draws, so that the reported percentiles are
# reproducible.  Set to None to leave the random state alone.
seed = 0

# Which ocean models carry non-zero weight in J3.  Options:
#   published - the four models of the published quadratic example
#   all       - every model in the ensemble
t3_models = all

# Which ice shelves carry non-zero weight in J4.  Options:
#   published - PIG alone, as the published quadratic example weights it
#   all       - PIG and Dotson
# The published weighting uses 2 of the 18 available observations and cannot
# discriminate between melt forms, because with one shelf J4 constrains a
# single amplitude that either form matches by rescaling its parameter.
t4_regions = all

# Which observation years carry non-zero weight in J4.  Options:
#   published - 2009 and 2012, as the published quadratic example weights it
#   all       - every year in the ensemble
t4_years = all


# config options for the basin thermal-forcing correction, dT_b
[ismip7_calibration_delta_t]

# Whether to fit dT_b after the parameter selection.  Protocol Sect. 4.2.1
# permits the correction to be fitted before or after; this follows option 2,
# after, as the published quadratic example does.  Fitting it first would
# leave the parameter bounds unconstrained where present-day melt is compared
# to observations, which is the drawback Sect. 4.2.1 names.
fit_delta_t = True

# Bounds on dT_b, in K.  The protocol recommends bounding it, since the
# warmest-to-coldest spread across Antarctic ice shelves is only 3-4 K.
delta_t_min = -2.0
delta_t_max = 2.0

# Number of points in the dT_b grid search
delta_t_count = 81
