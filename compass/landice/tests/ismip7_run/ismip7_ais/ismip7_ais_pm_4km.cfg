[ismip7_run_ais]

# List of experiments to set up.
# Can be "all", "historical", "projections", "ctrl", or a
# comma-delimited list of experiment names.
# Valid experiment names:
#   historical_CESM2-WACCM, historical_MRI-ESM2-0,
#   ssp126_CESM2-WACCM, ssp126_MRI-ESM2-0,
#   ssp370_CESM2-WACCM, ssp370_MRI-ESM2-0,
#   ssp585_CESM2-WACCM, ssp585_MRI-ESM2-0,
#   ctrl_CESM2-WACCM, ctrl_MRI-ESM2-0,
#   ocx
#exp_list = historical_CESM2-WACCM,ssp585_CESM2-WACCM
exp_list = ocx

# Number of tasks to use for each run
ntasks = 512

# Value to use for config_pio_stride.
# Should be divisible into ntasks
pio_stride = 128

# Base path to the pre-processed ISMIP7 forcing files.
# Expected layout:
#   {forcing_basepath}/{model}_{scenario}/atmosphere/
#   {forcing_basepath}/{model}_{scenario}/ocean_thermal_forcing/
# User has to supply.
forcing_basepath = /global/cfs/cdirs/m4288/users/hollyhan/ISMIP7/ISMIP7_forcing_processed_CoreExp_AIS4km

# Path to the initial condition file. User has to supply.
init_cond_path = /global/cfs/cdirs/fanssie/MALI_projects/ISMIP7/AIS/4km/input_files/20261114_m1o5/AIS_4to20km_r03_20260925_m1o5_2yrRelax.nc

# Path to the file for the basal melt parametrization coefficients.
melt_params_path = /global/cfs/cdirs/fanssie/MALI_projects/ISMIP7/AIS/4km/input_files/20261114_m1o5/melt_params_ismip7_p50.nc

# Path to the reference surface elevation file
reference_surface_path = /global/cfs/cdirs/fanssie/MALI_projects/ISMIP7/AIS/4km/input_files/20261114_m1o5/AIS_4to20km_r03_20260925_m1o5_2yrRelax_upper_surface.nc

# Path to the region mask file
region_mask_path = /global/cfs/cdirs/fanssie/MALI_projects/ISMIP7/AIS/4km/input_files/20261114_m1o5/AIS_4to20km_r03_20260905_ismip6_regionMasks.nc

# Path to OCX (observationally constrained experiment) forcing.
# User has to supply if running the ocx experiment.
ocx_forcing_path = /global/cfs/cdirs/m4288/users/hollyhan/ISMIP7/ISMIP7_forcing_processed_CoreExp_AIS4km/OCX_main/

# Calving method to use. Options: restore, von_mises
calving_method = restore

# Path to the file containing the von Mises parameter fields.
# Only required if calving_method is set to 'von_mises'.
von_mises_parameter_path = NotAvailable

# Which glacial isostatic adjustment (GIA) coupling to use. Options:
#   none         - no GIA coupling (fixed bed)
#   1dSLM        - couple to the 1-D sea-level model (uses the slm_* and
#                  nglv options below)
#   FastIsostasy - couple to FastIsostasy (uses the fastiso_* options below)
gia_model = FastIsostasy

# Whether to use damage-based calving with a spatially-varying threshold
use_damage_calving = false

# Path to the file containing the damage calving threshold field.
# If provided, the damageCalvingThreshold stream will be added.
# Actual use is controlled by namelist options in MALI.
damage_calving_threshold_path = NotAvailable

# Path to the directory containing globally defined ice thickness
# field for the sea-level model
slm_input_ice = NotAvailable

# Path to the directory containing earth model for the sea-level model
slm_input_earth = NotAvailable

# Earth structure profile filename
slm_earth_structure = prem_512.l60K2C.sum18p6.dum19p2.tz19p4.lm22

# Path to the directory containing other SLM input files
slm_input_others = NotAvailable

# Number of gauss-legendre nodes in latitude (typically multiple of 512)
nglv = 2048

# Path to the directory housing FastIsostasy input files: the Earth
# structure (rheology) file and, optionally, the interactive-sea-level
# activation mask file.
fastiso_path = /global/cfs/cdirs/fanssie/MALI_projects/FastIsostasy_Inputs/

# Earth structure (3D-lumped 2D) profile filename, found under fastiso_path
# filename options: weak-earth.nc, medium-earth.nc, strong-earth.nc
fastiso_earth_structure_filename = weak-earth.nc

# Interactive-sea-level activation mask filename, found under fastiso_path.
# "None" uses FastIsostasy's default hard-edged ice-domain-only activation.
fastiso_mask_filename = mask_full_domain.nc

# Resolution of FastIsostasy grid in kilometers (should match ISMIP7 grid)
# Valid resolutions for AIS: 2, 4, 8, 16
# Note: for now, resolution finer than 8 km yield numerically unstable results
fastiso_res_km = 8

# Optionally write job_script.custom.sh, which runs the MALI executable
# directly (in addition to the standard compass job_script.sh).
# Options: None (no custom script) or custom
custom_job_script = custom

# Environment commands for the custom job script, as a single line, e.g.
# "source /path/to/modules.sh; export LD_LIBRARY_PATH=/path/lib:$$LD_LIBRARY_PATH"
# Write each literal $ as $$ so the config parser does not interpolate it.
# Required if custom_job_script = custom
custom_job_env_cmds = source /global/common/software/fanssie/pm_cpu_gnu_modules_20261030.sh; export LD_LIBRARY_PATH=/global/common/software/fanssie/superlu/7.0.1/gcc/14.3/lib64:$$LD_LIBRARY_PATH

[parallel]
parallel_executable = srun --label --cpu-bind=cores
account = m4288
