[ismip7_run_gris]

# List of experiments to set up.
# Can be "all", "historical", "projections", "ctrl", or a
# comma-delimited list of experiment names.
exp_list = historical_CESM2-WACCM

# Number of tasks to use for each run
ntasks = 512

# Value to use for config_pio_stride.
pio_stride = 128

# Base path to the pre-processed ISMIP7 forcing files.
# Expected layout:
#   {forcing_basepath}/{model}_{scenario}/atmosphere/
#   {forcing_basepath}/{model}_{scenario}/ocean_thermal_forcing/
# User has to supply.
forcing_basepath = /global/cfs/cdirs/m4288/users/trhille/ISMIP7/test_processing/GIS

# Path to the initial condition file. User has to supply.
init_cond_path = /global/cfs/cdirs/fanssie/MALI_input_files/GIS_1to10km_r02/GIS_1to10km_r02_20230202_remove_icebergs.nc

# Path to the file for the basal melt parametrization coefficients.
melt_params_path = NotAvailable

# Path to the region mask file
region_mask_path = /global/cfs/cdirs/fanssie/MALI_input_files/GIS_1to10km_r02/GIS_1to10km_r02_20230202_ismip6_regionMasks.nc

# Path to the ocean thermal forcing climatology file for CTRL2015 runs.
ctrl_tf_climatology_path = NotAvailable

# Path to the atmosphere climatology files for CTRL2015 runs.
ctrl_atm_climatology_path = NotAvailable

# Path to OCX forcing.
ocx_forcing_path = NotAvailable

# Calving method to use. Options: restore, von_mises
calving_method = restore

# Path to the von Mises parameter fields.
von_mises_parameter_path = NotAvailable

[parallel]
parallel_executable = srun --label --cpu-bind=cores
