# config options for ismip7 forcing data
[ismip7]

# Ice sheet: ais (Antarctic) or gis (Greenland)
ice_sheet = ais

# Base path to the input ISMIP7 forcing files. User has to supply.
base_path_ismip7 = /global/cfs/cdirs/m4288/users/trhille/ISMIP7/forcing/AIS/CESM2-WACCM/ssp585

# Base path to the MALI mesh. User has to supply.
base_path_mali = /global/cfs/cdirs/fanssie/MALI_input_files/AIS_4to20km_r01

# Base path to which output forcing files are saved.
output_base_path = /global/cfs/cdirs/m4288/users/trhille/ISMIP7/test_processing/AIS

# Name of climate model used to generate ISMIP7 forcing data. User has to supply.
# Available model names: CESM2-WACCM, MRI-ESM2-0
model = CESM2-WACCM

# Scenario for forcing data. User has to supply.
# Available scenarios: historical, ssp126, ssp370, ssp585
scenario = ssp585

# Name of the MALI mesh. Used to name mapping and output files.
mali_mesh_name = AIS_4to20km_r01_20220907

# MALI mesh file (e.g. Antarctic_8to80km_20220407.nc). User has to supply.
mali_mesh_file = AIS_4to20km_r01_20220907.nc

# Number of MPI tasks for ESMF_RegridWeightGen
esmf_ntasks = 512

# Whether to process time-varying ocean thermal forcing (ESM scenario data)
process_ocean_thermal = false

# Whether to process observational ocean thermal forcing climatology
process_ocean_climatology = true

# config options for ismip7 atmosphere forcing
[ismip7_atmosphere]

# Remapping method. Options: bilinear, neareststod, conserve
method_remap = conserve

# Start year for processing
start_year = 2015

# End year for processing
end_year = 2301

# config options for ismip7 ocean thermal forcing
[ismip7_ocean_thermal]

# Remapping method. Options: bilinear, neareststod, conserve
method_remap = bilinear

# Start year for processing
start_year = 2015

# End year for processing
end_year = 2301

# config options for ismip7 ocean thermal forcing climatology
[ismip7_ocean_climatology]

# Remapping method. Options: bilinear, neareststod, conserve
method_remap = bilinear

# Base path to observational climatology data
# (directory containing tf/, so/, thetao/ subdirs)
base_path_climatology = /global/cfs/cdirs/m4288/users/trhille/ISMIP7/forcing/AIS/obs/zhou_annual_06_nov

# config options for ismip7 fracture (Path C, ice shelf collapse) forcing
[ismip7_fracture]

# Remapping method for each pathway. Set a method to None to skip processing
# that pathway's file. Options: bilinear, neareststod, conserve, None

# Remapping method for the ice shelf collapse mask (Path C). neareststod
# preserves the 0/1 mask values.
method_remap_shelf_collapse = neareststod

# Remapping method for the excess meltwater field (Path A), a flux.
method_remap_excess_melt = conserve

# Remapping method for the supraglacial lake properties (Path B).
method_remap_lake_properties = bilinear

# Version subdirectory of the fracture forcing data
version = v2

# Start year for processing
start_year = 2015

# End year for processing
end_year = 2300
