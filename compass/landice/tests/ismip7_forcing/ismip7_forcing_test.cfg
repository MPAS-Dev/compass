# config options for ismip7 forcing data
[ismip7]

# Ice sheet: ais (Antarctic) or gis (Greenland)
ice_sheet = ais

# Base path to the input ISMIP7 forcing files. User has to supply.
base_path_ismip7 = /global/cfs/cdirs/m4288/users/trhille/ISMIP7/forcing/AIS/CESM2-WACCM/ssp585

# Base path to the MALI mesh. User has to supply.
base_path_mali = /global/cfs/cdirs/fanssie/MALI_input_files/AIS_4to20km_r01

# Base path to which output forcing files are saved.
output_base_path = /global/cfs/cdirs/m4288/users/trhille/ISMIP7/test_processing/AIS

# Name of climate model used to generate ISMIP7 forcing data. User has to supply.
# Available model names: CESM2-WACCM, MRI-ESM2-0
model = CESM2-WACCM

# Scenario for forcing data. User has to supply.
# Available scenarios: historical, ssp126, ssp370, ssp585
scenario = ssp585

# Name of the MALI mesh. Used to name mapping and output files.
mali_mesh_name = AIS_4to20km_r01_20220907

# MALI mesh file (e.g. Antarctic_8to80km_20220407.nc). User has to supply.
mali_mesh_file = AIS_4to20km_r01_20220907.nc

# Number of MPI tasks for ESMF_RegridWeightGen
esmf_ntasks = 512

# config options for ismip7 atmosphere forcing
[ismip7_atmosphere]

# Remapping method. Options: bilinear, neareststod, conserve
method_remap = conserve

# Start year for processing
start_year = 2015

# End year for processing
end_year = 2301

# config options for ismip7 ocean thermal forcing
[ismip7_ocean_thermal]

# Remapping method. Options: bilinear, neareststod, conserve
method_remap = bilinear

# Start year for processing
start_year = 2015

# End year for processing
end_year = 2301
