# Example config for processing the GrIS ISMIP7 OCX (reanalysis) forcing.
# OCX has no distinct ESM model: it uses RACMO2.3p2-ERA for the atmosphere and
# EN4 for the ocean, selected automatically when scenario = OCX. The [ismip7]
# model option is ignored for OCX (set it to None). The same config file drives
# both test cases; set them up individually, e.g.:
#   compass setup -t landice/ismip7_forcing/atmosphere -w WORKDIR -f ismip7_forcing_ocx_gis.cfg
#   compass setup -t landice/ismip7_forcing/ocean_thermal -w WORKDIR -f ismip7_forcing_ocx_gis.cfg

# config options for ismip7 forcing data
[ismip7]

# Ice sheet: ais (Antarctic) or gis (Greenland)
ice_sheet = gis

# Base path to the input ISMIP7 forcing files. User has to supply.
base_path_ismip7 = /global/cfs/cdirs/m4288/users/trhille/ISMIP7/forcing/GIS/OCX

# Base path to the MALI mesh. User has to supply.
base_path_mali = /global/cfs/cdirs/fanssie/MALI_input_files/GIS_1to10km_r02/

# Base path to which output forcing files are saved.
output_base_path = /global/cfs/cdirs/m4288/users/trhille/ISMIP7/test_processing/GIS

# OCX has no distinct model (RACMO for atmosphere, EN4 for ocean are selected
# automatically), so this option is ignored.
model = None

# Scenario for forcing data.
scenario = OCX

# Name of the MALI mesh. Used to name mapping and output files.
mali_mesh_name = GIS_1to10km_r02_20230202

# MALI mesh file. User has to supply.
mali_mesh_file = GIS_1to10km_r02_20230202.nc

# Number of MPI tasks for ESMF_RegridWeightGen
esmf_ntasks = 512

# Whether to process time-varying ocean thermal forcing (ESM scenario data)
process_ocean_thermal = true

# Whether to process observational ocean thermal forcing climatology
process_ocean_climatology = false

# config options for ismip7 atmosphere forcing
[ismip7_atmosphere]

# Remapping method. Options: bilinear, neareststod, conserve
method_remap = conserve

# Start year for processing
start_year = 1990

# End year for processing
end_year = 2025

# config options for ismip7 ocean thermal forcing
[ismip7_ocean_thermal]

# Remapping method. Options: bilinear, neareststod, conserve
method_remap = bilinear

# Start year for processing
start_year = 1990

# End year for processing
end_year = 2025

# config options for ismip7 ocean thermal forcing climatology
[ismip7_ocean_climatology]

# Remapping method. Options: bilinear, neareststod, conserve
method_remap = bilinear

# Base path to observational climatology data
base_path_climatology = None
